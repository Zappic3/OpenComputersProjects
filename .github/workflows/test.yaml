name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and luarocks
        run: sudo apt-get install -y lua5.3 liblua5.3-dev luarocks

      - name: Cache luarocks dependencies
        uses: actions/cache@v4
        with:
          path: ~/.luarocks
          key: luarocks-${{ runner.os }}-${{ hashFiles('**/.busted') }}
          restore-keys: |
            luarocks-${{ runner.os }}-

      - name: Install busted
        run: luarocks install --local busted

      - name: Run tests
        run: |
          eval $(luarocks path --bin)
          busted --output=TAP check_reqs/spec